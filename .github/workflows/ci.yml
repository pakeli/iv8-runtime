name: CI

# Cross-platform V8-free build/API guards. Runtime tests run separately in
# v8-ci.yml (PRs/pushes) and the three V8-linked release workflows.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} - py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # macos-13 (Intel) runners are scarce/being retired and can queue for a long
    # time. It is kept only for redundant Intel-mac coverage and is NON-BLOCKING:
    # macOS is gated by macos-14 (arm64). See docs/dependency_strategy.md §11 EC-3.
    continue-on-error: ${{ matrix.os == 'macos-13' }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 everywhere + macOS arm64 (macos-14, required gate) and macOS x64
        # (macos-13, non-blocking redundant coverage).
        os: [ubuntu-latest, windows-latest, macos-14, macos-13]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Windows must build with clang-cl to match the future v8_monolith ABI
      # (§5.4 / EC-1). LLVM is preinstalled on the windows-latest image.
      - name: Put clang-cl on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"

      - name: Build wheel (PEP 517)
        run: python -m pip wheel . --no-deps -w dist

      - name: Install wheel and test outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          WHL=$(ls dist/*.whl)
          python -m pip install "$WHL" "pytest>=7"
          # cd out of the checkout so `import iv8` resolves to the installed wheel.
          cd "$RUNNER_TEMP"
          python -c "import iv8; assert 'site-packages' in iv8.__file__, iv8.__file__; print('pkg', iv8.__version__, '| v8', iv8._v8_version, '| linked', iv8._v8_linked); assert iv8.__version__ != iv8._v8_version; assert iv8._v8_linked is False"
          python -m pytest "$GITHUB_WORKSPACE/test" -v
