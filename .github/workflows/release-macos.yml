name: release-macos
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-macos
  cancel-in-progress: false
jobs:
  export-v8:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed0588c9667d486ce692753f811dd6b25528987e
      - name: Restore pinned macOS arm64 V8 SDK
        id: v8cache
        uses: ./.github/actions/restore-v8-cache
        with:
          path: data/v8
          key: v8-macos-arm64-${{ hashFiles('tools/build_v8_macos.sh', 'cmake/v8_pin.cmake') }}
      - name: Check cached SDK
        run: |
          test -f data/v8/include/v8.h
          test -f data/v8/lib/libv8_monolith.a
          cat data/v8/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iv8-dev-v8-macos-arm64-15.0.245.19
          path: data/v8
          compression-level: 6
          retention-days: 3
          if-no-files-found: error
